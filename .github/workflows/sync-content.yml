name: Sync content

on:
  repository_dispatch:
    types: [content-updated]
  workflow_dispatch:

concurrency:
  group: sync-content
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: git submodule update --remote content/books content/papers
      - name: Commit and push if the pointers moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update content submodules" || exit 0
          git push
