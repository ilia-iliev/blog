name: Sync content

on:
  repository_dispatch:
    types: [content-updated]
  workflow_dispatch:

concurrency:
  group: sync-content
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          submodules: true
      - name: Bump the pointers and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            git submodule update --remote content/books content/papers
            git commit -am "Update content submodules" || exit 0
            git push && exit 0
            echo "push rejected, retrying ($attempt)"
          done
          echo "could not push after 3 attempts" >&2
          exit 1
