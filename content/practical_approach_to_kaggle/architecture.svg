<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 75 1040 365" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/>
    </marker>
  </defs>
  <rect width="1040" height="470" fill="#ffffff"/>

  <!-- Study input: 16 slices of one series, one expanded into RGB -->
  <text x="80" y="100" text-anchor="middle" font-weight="bold">One study</text>
  <g stroke="#1e1e1e" stroke-width="1" fill="#d0d0d0">
    <polygon points="22,140 46,118 46,208 22,230"/>
    <polygon points="28,140 52,118 52,208 28,230"/>
    <polygon points="34,140 58,118 58,208 34,230"/>
    <polygon points="40,140 64,118 64,208 40,230"/>
    <polygon points="46,140 70,118 70,208 46,230"/>
    <polygon points="52,140 76,118 76,208 52,230"/>
    <polygon points="58,140 82,118 82,208 58,230"/>
    <polygon points="64,140 88,118 88,208 64,230"/>
    <polygon points="70,140 94,118 94,208 70,230"/>
    <polygon points="76,140 100,118 100,208 76,230" fill="#ffc078"/>
    <polygon points="82,140 106,118 106,208 82,230"/>
    <polygon points="88,140 112,118 112,208 88,230"/>
    <polygon points="94,140 118,118 118,208 94,230"/>
    <polygon points="100,140 124,118 124,208 100,230"/>
    <polygon points="106,140 130,118 130,208 106,230"/>
    <polygon points="112,140 136,118 136,208 112,230"/>
  </g>
  <line x1="88" y1="222" x2="82" y2="246" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="3 3"/>
  <g stroke="#1e1e1e" stroke-width="1">
    <rect x="58" y="248" width="28" height="28" fill="#ffa8a8"/>
    <rect x="66" y="256" width="28" height="28" fill="#b2f2bb"/>
    <rect x="74" y="264" width="28" height="28" fill="#a5d8ff"/>
  </g>
  <text x="80" y="312" text-anchor="middle" font-size="12">slice + neighbours as RGB</text>
  <text x="80" y="340" text-anchor="middle">n series × 16 slices</text>
  <text x="80" y="360" text-anchor="middle">= 16n images</text>
  <text x="80" y="376" text-anchor="middle" font-size="12">(n ≈ 5, so ~80)</text>

  <line x1="155" y1="190" x2="200" y2="190" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Backbone -->
  <rect x="205" y="110" width="160" height="160" rx="10" fill="#e7f5ff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text x="285" y="150" text-anchor="middle" font-weight="bold">Backbone</text>
  <text x="285" y="180" text-anchor="middle" font-size="13">CoAtNet (224 px)</text>
  <text x="285" y="198" text-anchor="middle" font-size="13">or ConvNeXt (384 px)</text>
  <text x="285" y="230" text-anchor="middle" font-size="12">pretrained on</text>
  <text x="285" y="246" text-anchor="middle" font-size="12">knee slices (DINO)</text>
  <text x="285" y="300" text-anchor="middle" font-size="12">runs on every</text>
  <text x="285" y="316" text-anchor="middle" font-size="12">image separately</text>

  <line x1="370" y1="190" x2="415" y2="190" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Features -->
  <text x="480" y="100" text-anchor="middle" font-weight="bold">16n features</text>
  <g stroke="#1e1e1e" stroke-width="1" fill="#fff3bf">
    <rect x="425" y="120" width="10" height="140"/>
    <rect x="439" y="120" width="10" height="140"/>
    <rect x="453" y="120" width="10" height="140"/>
    <rect x="467" y="120" width="10" height="140"/>
    <rect x="481" y="120" width="10" height="140"/>
    <rect x="525" y="120" width="10" height="140"/>
  </g>
  <text x="508" y="195" text-anchor="middle">…</text>
  <text x="480" y="280" text-anchor="middle" font-size="12">768 numbers each</text>

  <!-- Series embedding -->
  <rect x="405" y="345" width="150" height="80" rx="10" fill="#ebfbee" stroke="#1e1e1e" stroke-width="1.5"/>
  <text x="480" y="370" text-anchor="middle" font-weight="bold" font-size="13">series metadata</text>
  <text x="480" y="392" text-anchor="middle" font-size="12">plane, fluid, contrast,</text>
  <text x="480" y="408" text-anchor="middle" font-size="12">depth in the series</text>
  <line x1="480" y1="340" x2="480" y2="290" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="545" y1="190" x2="590" y2="190" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Attention -->
  <rect x="595" y="110" width="190" height="160" rx="10" fill="#f3f0ff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text x="690" y="150" text-anchor="middle" font-weight="bold">Attention</text>
  <g stroke="#1e1e1e" stroke-width="1" fill="#d0bfff">
    <circle cx="625" cy="200" r="8"/><circle cx="651" cy="200" r="8"/><circle cx="677" cy="200" r="8"/>
    <circle cx="703" cy="200" r="8"/><circle cx="729" cy="200" r="8"/><circle cx="755" cy="200" r="8"/>
    <circle cx="625" cy="226" r="8"/><circle cx="651" cy="226" r="8"/><circle cx="677" cy="226" r="8"/>
    <circle cx="703" cy="226" r="8"/><circle cx="729" cy="226" r="8"/><circle cx="755" cy="226" r="8"/>
  </g>

  <line x1="790" y1="190" x2="835" y2="190" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Outputs -->
  <text x="930" y="100" text-anchor="middle" font-weight="bold">12 probabilities</text>
  <rect x="840" y="110" width="180" height="160" rx="10" fill="#fff4e6" stroke="#1e1e1e" stroke-width="1.5"/>
  <g stroke="#1e1e1e" stroke-width="1" fill="#ffc078">
    <rect x="850" y="223" width="10" height="17"/>
    <rect x="864" y="231" width="10" height="9"/>
    <rect x="878" y="163" width="10" height="77"/>
    <rect x="892" y="218" width="10" height="22"/>
    <rect x="906" y="201" width="10" height="39"/>
    <rect x="920" y="229" width="10" height="11"/>
    <rect x="934" y="212" width="10" height="28"/>
    <rect x="948" y="146" width="10" height="94"/>
    <rect x="962" y="196" width="10" height="44"/>
    <rect x="976" y="227" width="10" height="13"/>
    <rect x="990" y="207" width="10" height="33"/>
    <rect x="1004" y="234" width="10" height="6"/>
  </g>
  <line x1="846" y1="240" x2="1014" y2="240" stroke="#1e1e1e" stroke-width="1"/>
  <text x="850" y="258" font-size="11">ACL</text>
  <text x="1014" y="258" text-anchor="end" font-size="11">fracture</text>
  <text x="930" y="300" text-anchor="middle" font-size="12">one per abnormality,</text>
  <text x="930" y="316" text-anchor="middle" font-size="12">each its own classifier</text>
</svg>
